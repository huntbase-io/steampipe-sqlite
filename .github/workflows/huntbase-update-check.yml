name: Huntbase plugin update check

# Weekly: are there newer releases of the plugins in huntbase/plugins.txt, and
# has upstream turbot/steampipe-sqlite moved (or fixed the cursor bug itself)?
# Keeps ONE rolling PR from branch bot/plugin-updates that bumps plugins.txt
# and BUILD_VERSION; no PR when nothing changed. Merging it triggers the
# Huntbase release workflow (BUILD_VERSION changed), which publishes
# huntbase-r<N+1> for hb-backend's steampipe-rollout. See huntbase/ROLLOUT.md.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huntbase-update-check
  cancel-in-progress: false

env:
  BRANCH: bot/plugin-updates
  TITLE: 'huntbase: update pinned steampipe plugins'

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push bot/plugin-updates
      pull-requests: write   # open / update the rolling PR
      actions: write         # start the release build on the PR branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: Check plugins and upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I huntbase/update_check.py --write --pr-body pr.md --summary summary.md --json update-check.json
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: update-check
          path: update-check.json
      - name: Open or update the rolling PR
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.check.outputs.changed }}
          BUILD: ${{ steps.check.outputs.build }}
          UPDATES: ${{ steps.check.outputs.updates }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base dev --state open --json number -q '.[0].number // empty')
          if [[ "$CHANGED" != true ]]; then
            if [[ -n "$pr" ]]; then
              gh pr close "$pr" -R "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Every pinned plugin is on its latest release now; closing."
            fi
            echo "No plugin updates."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git commit -qam "huntbase: update $UPDATES pinned plugins, build $BUILD" \
            -m "Generated by huntbase/update_check.py (huntbase-update-check workflow)."
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pushed=false
          # Quiet: only push when the result differs from what the PR already has.
          # (same files, and based on the current huntbase head).
          if git fetch -q "$remote" "$BRANCH" 2>/dev/null && \
             [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]] && \
             [[ "$(git rev-parse FETCH_HEAD~1)" == "$(git rev-parse HEAD~1)" ]]; then
            echo "$BRANCH already has these changes"
          else
            git push -q -f "$remote" "HEAD:refs/heads/$BRANCH"; pushed=true
          fi

          if [[ -z "$pr" ]]; then
            gh pr create -R "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --title "$TITLE" --body-file pr.md
          else
            jq -n --rawfile body pr.md --arg title "$TITLE" '{title: $title, body: $body}' \
              | gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" --input - >/dev/null
            echo "Updated PR #$pr"
          fi
          # PRs and pushes made with GITHUB_TOKEN don't start workflows; a dispatch does.
          if $pushed; then
            gh workflow run huntbase-release.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
          fi
